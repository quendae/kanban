name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Print generated lockfile
        run: |
          echo '===PNPM_LOCKFILE_BEGIN==='
          cat pnpm-lock.yaml
          echo '===PNPM_LOCKFILE_END==='

      - name: Guard deterministic rules runtime
        run: |
          if grep -R --line-number --fixed-strings 'Math.random(' packages/rules/src; then
            echo 'Math.random() is forbidden in deterministic rules runtime.'
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
